services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: ml_backend
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models:ro
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: ml_frontend
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://backend:8000/predict
      - PYTHONUNBUFFERED=1
    depends_on:
      - backend
    restart: unless-stopped